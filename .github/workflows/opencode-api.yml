name: opencode API

on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/cockpit/opencode*.go"
      - "internal/cockpit/opencodeapi/**"
      - ".github/workflows/opencode-api.yml"

permissions:
  contents: read

concurrency:
  group: opencode-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"package":"opencode-ai@1.19","name":"v1-pinned","flags":""},{"package":"@opencode/cli@2.1.0","name":"v2-pinned","flags":"--v2"}]' || '[{"package":"opencode-ai@1.19","name":"v1-pinned","flags":""},{"package":"opencode-ai@latest","name":"v1-latest","flags":""},{"package":"@opencode/cli@2.1.0","name":"v2-pinned","flags":"--v2"},{"package":"@opencode/cli@latest","name":"v2-latest","flags":"--v2"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install opencode
        run: npm install -g "${{ matrix.package }}"
      - name: Record installed version
        run: opencode --version
      - name: Test contract projection
        run: python3 -m unittest discover -s internal/cockpit/opencodeapi -p '*_test.py' -v
      - name: Fetch schema in an isolated home
        run: python3 internal/cockpit/opencodeapi/probe.py ${{ matrix.flags }} "$RUNNER_TEMP/opencode-openapi.json"
      - name: Compare consumed paths and schemas
        run: python3 internal/cockpit/opencodeapi/check.py ${{ matrix.flags }} "$RUNNER_TEMP/opencode-openapi.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-api-${{ matrix.name }}
          path: ${{ runner.temp }}/opencode-openapi.json
          if-no-files-found: ignore
