# Fly.io config for the Pactify zero-knowledge relay (staging).
# Lives at the cloud/ root alongside fly.toml (see that file's header for why).
# Deploy from cloud/:
#   fly deploy -c fly.staging.toml
# Secrets (set once, never commit them):
#   fly secrets set DATABASE_URL="<staging db>" RELAY_SECRET="<32+ random bytes>" -c fly.staging.toml

app = "pactify-relay-staging"
primary_region = "sin"

[build]
  dockerfile = "relay/Dockerfile"

[env]
  PORT = "4310"

[http_service]
  internal_port = 4310
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # SINGLE INSTANCE ONLY (until Redis-backed): the relay keeps in-process state
  # (PairStore, rate limiters) that a load balancer would split across machines —
  # pairing/limits break with >1. Deploy with `fly deploy --ha=false` and keep
  # `fly scale count 1`. Multi-instance (Redis adapter for PairStore + limits) is
  # a prod-scaling prerequisite tracked in backlog.
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
