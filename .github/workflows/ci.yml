name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Claude Code caches an installed plugin by its version: a change under
  # plugins/pactify/ that keeps the same version never reaches users who already
  # installed it (/plugin update and /reload-plugins keep the old cache).
  plugin-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: plugin changes bump plugin.json version
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --quiet "$base"...HEAD -- plugins/pactify; then
            echo "plugins/pactify unchanged"; exit 0
          fi
          old=$(git show "$base":plugins/pactify/.claude-plugin/plugin.json | jq -r .version)
          new=$(jq -r .version plugins/pactify/.claude-plugin/plugin.json)
          if [ "$old" = "$new" ]; then
            echo "::error file=plugins/pactify/.claude-plugin/plugin.json::plugins/pactify changed but version is still $new; bump it so installed plugins update"
            exit 1
          fi
          echo "plugin version $old -> $new"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install web deps
        run: cd web && npm ci
      - name: go mod tidy check
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: generated plugin distributions are current
        run: go run ./internal/plugingen/cmd/plugingen -check
      - name: go build
        run: go build ./...
      - name: install bats
        run: npm install -g bats@1.12.0
      - name: bats
        run: bats tests/
      - name: web tests
        run: cd web && npm test
      - name: web typecheck
        run: cd web && npx tsc -b --noEmit
      - name: embedded panel dist in sync with panel source
        run: |
          cd web && npm run build:panel && cd ..
          git diff --exit-code -- internal/subpanel/dist || {
            echo "::error::internal/subpanel/dist is stale — run 'cd web && npm run build:panel' and commit it"; exit 1; }
          test -z "$(git ls-files --others --exclude-standard internal/subpanel/dist)"
      - name: embedded dist in sync with web source
        run: |
          cd web && npm run build && cd ..
          git diff --exit-code -- internal/serve/dist || {
            echo "::error::internal/serve/dist is stale — run 'cd web && npm run build' and commit it"; exit 1; }

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install web deps
        run: cd web && npm ci
      - name: install chromium
        run: cd web && npx playwright install chromium --with-deps
      - name: playwright e2e (build + test)
        run: cd web && npm run e2e
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
