version: 2

project_name: pactify

before:
  hooks:
    # -diff fails loudly instead of silently rewriting go.mod mid-release
    - go mod tidy -diff

builds:
  - id: pactify
    main: ./cmd/pactify
    binary: pactify
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: pactify
    name_template: "pactify_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: agentjoey
    name: pactify
  draft: false
  prerelease: auto

changelog:
  use: github
