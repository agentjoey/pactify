name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # web bundles cloud/* source (vite alias), which imports @noble/@scure —
      # so cloud deps must be present before ANY web build/type-check/test.
      - name: install cloud workspace deps
        run: cd cloud && npx pnpm@10 install --frozen-lockfile
      - name: install web deps
        run: cd web && npm ci
      - name: go mod tidy check
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build ./...
      - name: install bats
        run: npm install -g bats@1.12.0
      - name: bats
        run: bats tests/
      - name: web tests
        run: cd web && npm test
      - name: web typecheck
        run: cd web && npx tsc -b --noEmit
      - name: cloud workspace (wire tests + wire/relay type-check)
        run: |
          cd cloud
          npx pnpm@10 --filter @pactify-apps/wire build
          npx pnpm@10 --filter @pactify-apps/wire test
          npx pnpm@10 --filter @pactify-apps/relay build   # prisma generate + tsc (type-check; no DB)
      - name: embedded dist in sync with web source
        run: |
          cd web && npm run build && cd ..
          git diff --exit-code -- internal/serve/dist || {
            echo "::error::internal/serve/dist is stale — run 'cd web && npm run build' and commit it"; exit 1; }

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # e2e builds web too → same cloud-deps prerequisite as the test job.
      - name: install cloud workspace deps
        run: cd cloud && npx pnpm@10 install --frozen-lockfile
      - name: install web deps
        run: cd web && npm ci
      - name: install chromium
        run: cd web && npx playwright install chromium --with-deps
      - name: playwright e2e (build + test)
        run: cd web && npm run e2e
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
