name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 25, not 15: measured on run 33861706998, the job spends ~10 min INSTALLING
    # (cloud deps 308s + web deps 302s) and only ~3.7 min testing (go test 62s,
    # bats 66s, web tests 95s, cloud 12s). At 15 it died mid-suite with every
    # test already green — the same starvation that once hid bats/web/cloud
    # behind a failing earlier step. The pnpm cache below cuts the common case;
    # this ceiling is the headroom for a cold one.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The pnpm store had NO cache in either job, so this install paid full
      # network cost on every run (237s in e2e, 308s here, same commit).
      - name: cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('cloud/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      # web bundles cloud/* source (vite alias), which imports @noble/@scure —
      # so cloud deps must be present before ANY web build/type-check/test.
      - name: install cloud workspace deps
        run: cd cloud && npx pnpm@10 install --frozen-lockfile --store-dir ~/.pnpm-store
      - name: install web deps
        run: cd web && npm ci
      - name: go mod tidy check
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build ./...
      - name: install bats
        run: npm install -g bats@1.12.0
      - name: bats
        run: bats tests/
      - name: web tests
        run: cd web && npm test
      - name: web typecheck
        run: cd web && npx tsc -b --noEmit
      - name: cloud workspace (wire + relay tests + type-check)
        run: |
          cd cloud
          # Build the relay AND its workspace deps in dependency order — the
          # `relay...` filter selects relay plus everything it depends on (wire ←
          # crypto ← relay) and builds them topologically. Their package entries
          # resolve to dist/, so vitest can't load them unbuilt: crypto is imported
          # by identity-link.test.ts, wire by the ingest path, and crypto itself
          # imports wire (so wire must build first). This build also runs relay's
          # prisma generate + tsc type-check.
          npx pnpm@10 --filter "@pactify-apps/relay..." build
          npx pnpm@10 --filter @pactify-apps/wire test
          # Run the relay suite on PGlite (no external DB) so tenant-isolation /
          # auth regressions (e.g. the C1/H3 security tests) actually gate CI —
          # previously the relay was only type-checked, never run.
          npx pnpm@10 --filter @pactify-apps/relay test
      - name: embedded dist in sync with web source
        run: |
          cd web && npm run build && cd ..
          git diff --exit-code -- internal/serve/dist || {
            echo "::error::internal/serve/dist is stale — run 'cd web && npm run build' and commit it"; exit 1; }

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('cloud/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      # e2e builds web too → same cloud-deps prerequisite as the test job.
      - name: install cloud workspace deps
        run: cd cloud && npx pnpm@10 install --frozen-lockfile --store-dir ~/.pnpm-store
      - name: install web deps
        run: cd web && npm ci
      - name: install chromium
        run: cd web && npx playwright install chromium --with-deps
      - name: playwright e2e (build + test)
        run: cd web && npm run e2e
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
