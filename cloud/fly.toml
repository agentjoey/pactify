# Fly.io config for the Pactify zero-knowledge relay (production).
# This file lives at the cloud/ root ON PURPOSE: the config dir, the build
# context, and the `dockerfile` path below all resolve to cloud/, so `relay/
# Dockerfile` (which COPYs both wire/ and relay/) is always found. There is no
# fly.toml inside relay/ to accidentally `cd relay/ && fly deploy` against.
# Deploy from cloud/:
#   fly deploy                       # auto-picks this file (production)
# Secrets (set once, never commit them):
#   fly secrets set DATABASE_URL="<neon pooled connection string>" RELAY_SECRET="<32+ random bytes>"
# The container runs `prisma migrate deploy` on boot, then `node dist/server-main.js`.

app = "pactify-relay"
primary_region = "sin" # Singapore — co-located with the Neon project

[build]
  dockerfile = "relay/Dockerfile"

[env]
  PORT = "4310"

[http_service]
  internal_port = 4310
  force_https = true
  auto_stop_machines = "off"  # relay holds long-lived linxd sockets — never suspend/stop
  auto_start_machines = true
  # SINGLE INSTANCE ONLY (until Redis-backed): in-process PairStore + rate limiters
  # break if a load balancer splits them across machines. Deploy `--ha=false`, keep
  # `fly scale count 1`. Redis-backed multi-instance is a prod-scaling prerequisite.
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
